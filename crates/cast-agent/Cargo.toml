[package]
name = "cast-agent"
version = "0.1.0"
edition = "2024"
description = "Process-isolated, supervised headless agent-harness launcher for cast"
authors = ["palekiwi"]
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "io-util",
    "time",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3"
tokio-util = "0.7.18"
